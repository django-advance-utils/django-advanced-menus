[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-advanced-menus"
version = "2.0.1"
description = "Django app to render menus and load tabs with Ajax"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ian Jones" },
]
maintainers = [
    { name = "Thomas Turner" },
]
dependencies = [
    "ajax-advanced-helpers>=1.0.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/django-advance-utils/django-advanced-menus"
Upstream = "https://github.com/jonesim/django-menus"

[tool.setuptools.packages.find]
include = ["django_menus", "django_menus.*"]

[tool.setuptools]
include-package-data = true
