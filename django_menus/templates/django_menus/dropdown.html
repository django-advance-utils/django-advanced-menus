{% spaceless %}
<div id='{{ menu.id }}-menu' class="dropdown-menu" role="menu">
    {% for i in menu.visible_items %}
        {% if i.default_render %}
            <a  class="django-menus-item dropdown-item {{ i.css }}"{% if i.dropdown %} id="{{ i.dropdown.id }}"{% endif %} href="{{ i.href }}" {{ i.attributes }}>{{ i.name }}{% if i.dropdown and i.show_caret %}<i class="fas fa-caret-right pt-1 {{ css.float_end }}"></i>{% endif %}</a>
        {% else %}
            {{ i.render }}
        {% endif %}
    {% endfor %}
</div>

<script>
    {% if menu.no_hover  %}
        dropdown_menu_click('{{ menu.id }}', '{{ menu.placement }}')
    {% else %}
        dropdown_menu_function('{{ menu.id }}', '{{ menu.placement }}')
    {% endif %}
</script>
{% endspaceless %}
